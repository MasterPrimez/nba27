<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NBA/27">
<title>NBA/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0E10; --s1:#16161A; --s2:#202025; --line:#2A2A2E; --tx:#EDEDEF; --dim:#8B8B93; --faint:#5C5C64;
  --acc:#FF8A00; --acc-ink:#0E0E10; --win:#4CD08A; --loss:#FF5C5C;
  --spring:cubic-bezier(.34,1.56,.64,1); --glide:cubic-bezier(.16,1,.3,1); --inout:cubic-bezier(.65,0,.35,1);
  --disp:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --ui:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background-color .6s var(--glide)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font:28px/1 var(--disp);letter-spacing:.01em}
.brand span{color:var(--acc)}
.src{display:inline-flex;align-items:center;gap:6px;margin-left:auto;padding:4px 9px;border:1px solid var(--line);border-radius:99px;font:11px var(--mono);color:var(--dim)}
.src::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--faint)}
.src.live::before{background:var(--win)}
.src.demo::before{background:var(--acc)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--dim)}
.icon-btn svg{width:20px;height:20px}

main{max-width:600px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){main{max-width:760px}}
main.in{animation:enter .55s var(--glide)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabs-in{position:relative;display:grid;grid-template-columns:repeat(6,1fr);max-width:560px;margin:0 auto}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:10.5px;font-weight:500;color:var(--dim);transition:color .3s}
.tab svg{width:22px;height:22px}
.tab[aria-current=page]{color:var(--acc)}
.tab-pill{position:absolute;top:0;bottom:0;left:0;width:calc(100% / 6);border-radius:12px;background:color-mix(in srgb,var(--acc) 13%,transparent);transition:transform .42s var(--inout)}

/* shared */
.pr{transition:transform .45s var(--spring)}
.pr:active{transform:scale(.975);transition-duration:.08s;transition-timing-function:ease-out}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px}
.list>*+*{border-top:1px solid var(--line)}
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 2px 10px}
.sec-h h2{font:600 16px var(--ui)}
.sec-h a,.sec-h span{font-size:13px;color:var(--dim)}
.sec-h a{color:var(--acc)}
.muted{color:var(--dim)}
.mono{font-family:var(--mono)}
.empty{padding:28px 18px;text-align:center;color:var(--dim);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--s2);color:var(--dim);font:10px var(--mono)}

/* logo badge */
.lg{--sz:28px;position:relative;display:inline-grid;place-items:center;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;background:var(--c1);color:var(--c2);font:600 calc(var(--sz)*.3)/1 var(--ui);overflow:hidden}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.lg.ok{background:none}
.lg.ok img{opacity:1}
.lg.ok b{visibility:hidden}

/* live status */
.live{display:inline-flex;align-items:center;gap:6px;color:var(--loss);font:600 11px var(--mono)}
.live::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--loss) 65%,transparent)}100%{box-shadow:0 0 0 8px transparent}}

/* probability bars */
.pbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--s2);gap:2px}
.pbar i{display:block;height:100%;transition:width .9s var(--glide)}
.mp{display:inline-flex;width:52px;height:4px;border-radius:99px;overflow:hidden;background:var(--s2)}
.mp i{display:block;height:100%}

/* hero */
.hero{position:relative;padding:18px 18px 16px;border-radius:22px;border:1px solid var(--line);overflow:hidden;background:linear-gradient(155deg,color-mix(in srgb,var(--tc1) 46%,var(--s1)) 0%,var(--s1) 72%)}
.hero-id{display:flex;align-items:center;gap:12px}
.hero-id .lg{--sz:46px}
.hero-name{font:38px/.85 var(--disp)}
.hero-sub{margin-top:3px;color:var(--dim);font-size:13px}
.hero-big{display:flex;align-items:flex-start;margin:22px 0 4px;font:144px/.78 var(--disp);color:var(--tb);letter-spacing:-.01em}
.hero-big small{font-size:56px;line-height:1;margin-left:4px}
.hero-cap{font-size:16px;font-weight:500}
.hero-meta{margin-top:4px;font:12px var(--mono);color:var(--dim)}
.hero-bar{margin-top:16px}
.hero-bar .lbl{display:flex;justify-content:space-between;margin-top:6px;font:11px var(--mono);color:var(--dim)}
.hero-act{display:flex;gap:8px;margin-top:16px}

/* game rows */
.g{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:11px 14px}
.g-row{display:flex;align-items:center;gap:10px;height:30px}
.g-ab{font-weight:600;font-size:15px;min-width:42px}
.g-rec{font:11px var(--mono);color:var(--faint)}
.g-sc{margin-left:auto;font:600 19px var(--mono)}
.g-row.lose{color:var(--dim)}
.g-meta{display:grid;gap:5px;justify-items:end;min-width:92px;font:12px var(--mono);color:var(--dim);text-align:right}
.g-meta .when{color:var(--tx)}
.fav{box-shadow:inset 3px 0 0 var(--acc)}

/* date strip */
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;padding:7px 0 6px;border-radius:12px;text-align:center;border:1px solid var(--line);background:var(--s1)}
.day b{display:block;font:24px/1 var(--disp)}
.day small{font-size:11px;color:var(--dim)}
.day[aria-current=date]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.day[aria-current=date] small{color:inherit;opacity:.75}

/* segmented */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.seg button{position:relative;z-index:1;padding:8px 0;font-weight:600;font-size:14px;color:var(--dim);transition:color .3s}
.seg button[aria-pressed=true]{color:var(--acc-ink)}
.seg-pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--acc);transition:transform .5s var(--spring)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font:13px var(--mono)}
.tbl th{padding:10px 6px 8px;font:500 11px var(--ui);color:var(--faint);text-align:right}
.tbl td{padding:9px 6px;text-align:right;border-top:1px solid var(--line)}
.tbl .l{text-align:left}
.tbl td.tm a{display:flex;align-items:center;gap:8px;font:600 14px var(--ui)}
.tbl .seed{width:24px;color:var(--faint);text-align:left;padding-left:12px}
.tbl tr.me td{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.tbl tr.cut-po td{border-bottom:1px solid var(--acc)}
.tbl tr.cut-pi td{border-bottom:1px dashed var(--faint)}
.legend{display:flex;gap:16px;margin:10px 4px 0;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:16px;margin-right:6px;vertical-align:middle;border-top:1px solid var(--acc)}
.legend i.d{border-top:1px dashed var(--faint)}

/* teams */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 10px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.tile .lg{--sz:34px}
.tile .nm{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.15}
.tile .nm small{display:block;font-weight:400;font-size:12px;color:var(--dim)}
.star{width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--faint);border-radius:10px}
.star svg{width:18px;height:18px}
.star[aria-pressed=true]{color:var(--acc)}
.star[aria-pressed=true] path{fill:currentColor}
.star.pop svg{animation:pop .55s var(--spring)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}

/* team page */
.tband{padding:18px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(155deg,color-mix(in srgb,var(--tc1) 50%,var(--s1)),var(--s1) 75%)}
.tband-top{display:flex;align-items:center;gap:14px}
.tband .lg{--sz:58px}
.tband h1{font:44px/.85 var(--disp)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bg) 45%,transparent)}
.stat b{display:block;font:30px/1 var(--disp);color:var(--tb)}
.stat small{font-size:12px;color:var(--dim)}
.sr{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:11px 14px;font-size:14px}
.sr .d{font:12px var(--mono);color:var(--dim)}
.sr .o{display:flex;align-items:center;gap:8px;min-width:0}
.sr .o span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .r{font:13px var(--mono);text-align:right}
.W{color:var(--win)} .L{color:var(--loss)}

/* charts */
.chart{padding:14px 12px 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart-cap{display:flex;justify-content:space-between;margin-top:6px;font:11px var(--mono);color:var(--dim)}

/* game page */
.gh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:22px 10px 18px;text-align:center}
.gh .tm{display:grid;justify-items:center;gap:6px}
.gh .tm .lg{--sz:54px}
.gh .tm b{font-size:15px}
.gh .tm small{font:11px var(--mono);color:var(--dim)}
.gh .sc{font:62px/1 var(--disp)}
.gh .sc.lose{color:var(--dim)}
.gh .mid{display:grid;justify-items:center;gap:6px;min-width:84px;font:12px var(--mono);color:var(--dim)}
.gh .scores{display:flex;gap:14px;align-items:center}
.watch{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.watch a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:500}
.watch a::after{content:'';width:7px;height:7px;border-top:1.5px solid var(--dim);border-right:1.5px solid var(--dim);transform:rotate(45deg)}
.ldr{display:grid;grid-template-columns:1fr 1fr;gap:0}
.ldr>div{padding:12px 14px}
.ldr>div+div{border-left:1px solid var(--line)}
.ldr .row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px}
.ldr .row b{font-family:var(--mono)}
.ldr .row span{color:var(--dim)}

/* live game stats */
.tsr{display:grid;grid-template-columns:70px minmax(0,1fr) 104px minmax(0,1fr) 70px;align-items:center;gap:8px;min-height:32px;font-size:13px}
.tsr small{color:var(--faint);font-size:10px}
.tsr .r{text-align:right}
.tsl{text-align:center;color:var(--dim);font-size:12px}
.tsb{display:flex;height:6px;border-radius:99px;background:var(--s2);overflow:hidden}
.tsb.l{justify-content:flex-end}
.tsb i{display:block;height:100%;border-radius:99px;transition:width .9s var(--glide)}
.box{overflow-x:auto}
.box .tbl td,.box .tbl th{padding:9px 7px}
.box .nm{position:sticky;left:0;z-index:1;background:var(--s1);min-width:128px;padding-left:12px!important;font-family:var(--ui);font-size:13px}
.box .nm b{font-weight:600}
.box td.hi{color:var(--acc);font-weight:600}
.box tr.bench td{color:var(--faint);font:500 11px var(--ui);padding-top:12px}
.box tr.tot td{font-weight:600;border-top:1px solid var(--faint)}
.pbp{display:grid;grid-template-columns:72px 20px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 14px;font-size:13px;color:var(--dim)}
.pbp.sc{color:var(--tx)}
.pbp .t{font-size:11px;color:var(--faint)}
.pbp .s{font-size:12px}

/* tv */
.net-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.net-h h3{font:26px/1 var(--disp)}
.net-h a{font-size:13px;color:var(--acc);font-weight:500}
.tvr{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:10px;padding:10px 14px;font-size:14px}
.tvr .t{font:12px var(--mono);color:var(--dim)}
.tvr .m{display:flex;align-items:center;gap:7px}

/* follow mini cards */
.minis{display:grid;gap:8px}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.mini .lg{--sz:36px}
.mini .x{font-size:14px;font-weight:600}
.mini .x small{display:block;font-weight:400;font:12px var(--mono);color:var(--dim)}
.mini .p{font:30px/1 var(--disp);color:var(--tb)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:600px;margin:0 auto;max-height:86%;overflow:auto;padding:8px 18px calc(26px + env(safe-area-inset-bottom,0px));background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .55s var(--glide)}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none}
.grab{width:38px;height:4px;margin:4px auto 14px;border-radius:99px;background:var(--line)}
.sheet h2{font:32px/1 var(--disp);margin-bottom:16px}
.set{margin-bottom:22px}
.set>label,.set>p.h{display:block;margin:0 0 8px;font-size:13px;color:var(--dim)}
.fl>div{display:flex;align-items:center;gap:10px;padding:10px 12px}
.fl .nm{flex:1;font-weight:600;font-size:14px}
.fl button{font-size:13px;color:var(--dim);padding:6px 8px;border-radius:8px}
.fl button.on{color:var(--acc)}

/* waiting */
.wait{display:grid;justify-items:center;gap:12px;padding:90px 0;color:var(--dim);font-size:13px}
.wait .ap{color:var(--acc);width:56px;height:56px}
.err{padding:22px;text-align:center}
.err p{margin:0 0 14px;color:var(--dim)}

/* chips (leaders categories, player-stat sort) */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:var(--s1);color:var(--dim);font-weight:600;font-size:13px;transition:transform .45s var(--spring),background .2s,color .2s}
.chip:active{transform:scale(.95);transition-duration:.08s}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
/* leaders */
.ld-top{display:flex;align-items:center;gap:16px;padding:18px}
.ld-top .lg{--sz:58px}
.ld-top .v{margin-left:auto;font:76px/.8 var(--disp);color:var(--acc)}
.ld-top .n{font:34px/1 var(--disp)}
.ldr-row{display:grid;grid-template-columns:24px 24px minmax(0,190px) minmax(0,1fr) 56px;align-items:center;gap:10px;min-height:44px;padding:0 16px;font-size:14px}
.ldr-row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldr-row .bar{height:6px;border-radius:99px;background:var(--s2);overflow:hidden}
.ldr-row .bar i{display:block;height:100%;border-radius:99px;background:var(--faint)}
.ldr-row.me{background:color-mix(in srgb,var(--acc) 7%,transparent)}
.ldr-row.me .bar i{background:var(--acc)}
/* player stats */
.ps{overflow-x:auto}
.ps .tbl th button{min-height:32px;padding:0 6px;border-radius:7px;color:var(--faint);font:500 11px var(--ui)}
.ps .tbl th button[aria-pressed=true]{color:var(--acc)}
.ps .tbl td.on{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.ps .nm{position:sticky;left:0;z-index:1;background:var(--s1);min-width:150px;padding-left:12px!important;font:13px var(--ui)}
.ps .nm b{font-weight:600}
.inj{display:inline-block;margin-left:6px;padding:0 5px;border-radius:5px;background:color-mix(in srgb,var(--loss) 18%,transparent);color:var(--loss);font:600 10px var(--mono)}
.tstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tstat>div{padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.tstat b{display:block;font:28px/1 var(--disp);color:var(--tb,var(--acc))}
.tstat small{font-size:12px;color:var(--dim)}
.injr{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;font-size:14px}
.injr span:last-child{font:12px var(--mono);color:var(--acc)}
/* standings extras (desktop only columns) */
.tbl .dx{display:none}
.conf2>section.off{display:none}
/* boxes: mobile shows the selected team only */
.boxw{display:none}
.boxw.sel{display:block}
.desk-only{display:none!important}

/* ============ desktop ============ */
@media (min-width:1024px){
  .desk-only{display:revert!important}
  .mob-only{display:none!important}
  .top{padding-left:24px;padding-right:28px;z-index:35}
  .tabs{top:0;bottom:0;right:auto;width:220px;padding:76px 12px 20px;border-top:0;border-right:1px solid var(--line);background:var(--bg)}
  .tabs-in{display:flex;flex-direction:column;gap:4px;max-width:none}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:0 12px;font-size:15px;border-radius:10px}
  .tab:hover{color:var(--tx);background:var(--s1)}
  .tab[aria-current=page]{background:color-mix(in srgb,var(--acc) 13%,transparent)}
  .tab-pill{display:none}
  main{max-width:none;margin:0 0 0 220px;padding:28px 40px 64px}
  main>*{max-width:1200px;margin-left:auto;margin-right:auto}
  .days{margin:0 auto 16px;padding:2px 0}
  .cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:28px;align-items:start}
  .cols>*>.sec:first-child{margin-top:0}
  .glist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:none;border:0}
  .glist.list>*+*{border-top:0}
  .glist>.g{background:var(--s1);border:1px solid var(--line);border-radius:14px}
  .glist>.g.fav{box-shadow:inset 3px 0 0 var(--acc)}

  const p=Phi(Math.abs(+m[2])/12);

}
/* home win prob right now, from series, scoreboard situation, or score+spread */
function homeProb(g,series){
  if(g.state==='post')return (g.home.score>g.away.score)?1:0;
  if(series&&series.length)return series[series.length-1]/100;

    return Phi(((g.home.score||0)-(g.away.score||0)+spread*(1-f))/(12*Math.sqrt(1-f)+.5));
  }

}

const LIVE={
  async scoreboard(d){const j=await getJSON(`${API}/scoreboard?dates=${d}`,25000);return (j.events||[]).map(normEvent)},
  async standings(){

    const bx=j.boxscore||{};
    const box=(bx.players||[]).map(side=>{const st=(side.statistics||[])[0]||{};const keys=st.keys||[];
      return {t:teamFrom(side.team),keys,totals:st.totals||[],
        players:(st.athletes||[]).map(a=>({name:(a.athlete&&(a.athlete.shortName||a.athlete.displayName))||'—',jersey:(a.athlete&&a.athlete.jersey)||'',
          pos:(a.athlete&&a.athlete.position&&a.athlete.position.abbreviation)||'',starter:!!a.starter,dnp:!!a.didNotPlay||!(a.stats&&a.stats.length),reason:a.reason||'',

  /* league leaders: current season first, last season if nothing has been played yet */
  async leaders(){

  async playerStats(ids){
    const rs=await Promise.allSettled(ids.map(id=>getJSON(`https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/athletes/${id}/overview`,600000)));
    const out={};let label='';
    rs.forEach((r,i)=>{if(r.status!=='fulfilled')return;const st=r.value.statistics;if(!st||!st.names)return;

      label=label||st.displayName||'';out[ids[i]]=Object.fromEntries(st.names.map((n,k)=>[n,sp.stats[k]]))});

/* extra feeds: live only, never flips the app into demo mode */
async function tryLive(fn,...a){if(MODE==='demo')return null;try{return await LIVE[fn](...a)}catch(e){return null}}

/* ============ demo data (used only when ESPN can't be reached) ============ */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){return Math.sqrt(-2*Math.log(r()||1e-9))*Math.cos(2*Math.PI*r())}
const NETS=['ESPN','ABC','NBC','Peacock','Prime Video','NBA TV'];
const LOCAL={'5':'FDSN Ohio','13':'Spectrum SportsNet','12':'FDSN SoCal','2':'NBC Sports Boston','18':'MSG','9':'NBC Sports Bay Area'};
let DB=null;
function demo(){
  if(DB)return DB;
  const r=rng(2027),rating={};TEAMS.forEach(t=>rating[t.id]=gauss(r)*4.5);rating['5']=6.2;
  const t0=today(),now=Date.now(),games=[];let gid=4019000;
  for(let d=-42;d<=45;d++){
    const day=new Date(t0);day.setDate(day.getDate()+d);
    const ids=TEAMS.map(t=>t.id).filter(i=>i!=='5').sort(()=>r()-.5);
    if(d%2===0)ids.unshift('5');else ids.push('5');
    const n=4+Math.floor(r()*6);
    for(let k=0;k<n;k++){
      const a=ids[2*k],b=ids[2*k+1],home=r()<.5?a:b,away=home===a?b:a;
      const slot=[16,16.5,19,19.5,19.5,22,22.5][Math.floor(r()*7)];
      const dt=new Date(day);dt.setHours(Math.floor(slot),slot%1?30:0,0,0);
      const diff=rating[home]-rating[away]+2.4,line=Math.round(diff*2)/2;
      const H=byId[home],A=byId[away];
      const nat=r()<.45?NETS[Math.floor(r()*NETS.length)]:null;
      const tv=[nat,LOCAL[home]||(nat?null:'NBA League Pass')].filter(Boolean);
      const margin=diff+gauss(r)*12,total=224+gauss(r)*11;
      let hs=Math.round((total+margin)/2),as=Math.round((total-margin)/2);if(hs===as)hs++;
      const g={id:String(gid++),date:dt,tv,venue:H.city+' Arena',city:H.city,stype:2,
        odds:line===0?'EVEN':(line>0?`${H.ab} -${Math.abs(line)}`:`${A.ab} -${Math.abs(line)}`),
        home:{t:H,score:null,rec:'',lines:[]},away:{t:A,score:null,rec:'',lines:[]},_fh:hs,_fa:as};
      if(d===0&&k===0){g.date=new Date(now-75*60000)}       // keep a live game in the demo
      games.push(g);
    }
  }
  const qsplit=(s)=>{const q=[];let left=s;for(let i=0;i<3;i++){const v=Math.round(s/4+gauss(r)*3);q.push(v);left-=v}q.push(left);return q};
  games.forEach(g=>{
    g.wpPre=wpFromOdds(g);
    const start=g.date.getTime(),end=start+2.4*3600e3;
    const hq=qsplit(g._fh),aq=qsplit(g._fa);
    if(end<now){g.state='post';g.detail='Final';g.home.score=g._fh;g.away.score=g._fa;g.home.lines=hq;g.away.lines=aq}
    else if(start<=now){
      g.state='in';const f=Math.min(.95,(now-start)/(2.4*3600e3));g.frac=f;

    <div class="chart-cap" style="margin-top:8px;font-size:13px"><span>${esc(g.away.t.ab)} ${100-pct(p)}%</span><span>${pct(p)}% ${esc(g.home.t.ab)}</span></div></div></section>`}
  const chart=wp&&wp.length>1?`<section class="sec"><div class="sec-h"><h2>Win probability flow</h2><span>${done?'Final':'Updating'}</span></div><div class="card">${wpSVG(wp,g)}</div></section>`:'';
  const ldr=leaders&&leaders.length?`<section class="sec"><div class="sec-h"><h2>Leaders</h2></div><div class="card ldr">${leaders.slice(0,2).map(L=>`<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">${logo(L.t,22)}<b>${esc(L.t.ab)}</b></div>${L.cats.map(c=>`<div class="row"><span>${esc(c.name)}</span><b>${esc(c.val)}</b></div><div class="muted" style="font-size:12px;margin:-4px 0 4px">${esc(c.who)}</div>`).join('')}</div>`).join('')}</div></section>`:'';
  const watch=`<section class="sec"><div class="sec-h"><h2>How to watch</h2></div><div class="card"><div class="watch">${(g.tv.length?g.tv:['NBA League Pass']).map(n=>`<a href="${watchUrl(n)}" target="_blank" rel="noopener">${esc(n)}</a>`).join('')}</div>${g.venue?`<div class="muted" style="padding:0 14px 14px;font-size:13px">${esc(g.venue)}${g.city?', '+esc(g.city):''}</div>`:''}</div></section>`;
  const live=g.state==='in'?`<span class="live">Live · updates every 15s</span>`:'';
  /* team stats comparison */
  const tsFor=id=>(tstats.find(x=>x.t.id===id)||{}).s;
  const A=tsFor(g.away.t.id),H=tsFor(g.home.t.id);
  let teamHTML='';
  if(A&&H){
    const ROWS=[['Field goals','fieldGoalsMade-fieldGoalsAttempted','fieldGoalPct'],['3-pointers','threePointFieldGoalsMade-threePointFieldGoalsAttempted','threePointFieldGoalPct'],['Free throws','freeThrowsMade-freeThrowsAttempted','freeThrowPct'],
      ['Rebounds','totalRebounds'],['Off. rebounds','offensiveRebounds'],['Assists','assists'],['Steals','steals'],['Blocks','blocks'],['Turnovers','totalTurnovers',null,1],['Points in paint','pointsInPaint'],['Fast break pts','fastBreakPoints'],['Largest lead','largestLead']];
    const ac=bright(g.away.t),hc=bright(g.home.t);
    teamHTML=`<section class="sec"><div class="sec-h"><h2>Team stats</h2>${live}</div><div class="card" style="padding:6px 14px 10px">${ROWS.map(([lbl,k,pk,low])=>{
      const av=A[k]??A[k==='totalTurnovers'?'turnovers':k],hv=H[k]??H[k==='totalTurnovers'?'turnovers':k];if(av==null&&hv==null)return '';
      const an=parseFloat(pk?A[pk]:av)||0,hn=parseFloat(pk?H[pk]:hv)||0,m=Math.max(an,hn)||1,aw=low?hn<=an:an>=hn,hw=low?an<=hn:hn>=an;
      return `<div class="tsr"><span class="mono">${esc(av??'–')}${pk&&A[pk]?` <small>${esc(A[pk])}%</small>`:''}</span><div class="tsb l"><i style="width:${an/m*100}%;background:${ac};opacity:${aw?1:.35}"></i></div><span class="tsl">${lbl}</span><div class="tsb"><i style="width:${hn/m*100}%;background:${hc};opacity:${hw?1:.35}"></i></div><span class="mono r">${pk&&H[pk]?`<small>${esc(H[pk])}%</small> `:''}${esc(hv??'–')}</span></div>`}).join('')}</div></section>`;
  }
  /* box score: both teams on desktop, selected team on phone */
  let boxHTML='';
  if(box.length){
    const side=sessionStorage.getItem('boxSide')||'a',selId=(side==='h'?g.home.t:g.away.t).id;
    const COLS=[['minutes','MIN'],['points','PTS'],['rebounds','REB'],['assists','AST'],['fieldGoalsMade-fieldGoalsAttempted','FG'],['threePointFieldGoalsMade-threePointFieldGoalsAttempted','3PT'],['freeThrowsMade-freeThrowsAttempted','FT'],['steals','STL'],['blocks','BLK'],['turnovers','TO'],['fouls','PF'],['plusMinus','+/−']];
    const order=[g.away.t.id,g.home.t.id].map(id=>box.find(b=>b.t.id===id)).filter(Boolean);
    const tableFor=B=>{const played=B.players.filter(p=>!p.dnp),dnp=B.players.filter(p=>p.dnp);
      const top=Math.max(0,...played.map(p=>+p.s.points||0));
      const row=p=>`<tr${p.starter?' class="st"':''}><td class="l nm"><b>${esc(p.name)}</b> <span class="muted">${esc(p.pos)}</span></td>${COLS.map(([k])=>{const v=p.s[k]??'';const hi=k==='points'&&+v===top&&top>0;const pm=k==='plusMinus'&&v!==''?(+v>0?'W':+v<0?'L':''):'';const fl=k==='fouls'&&+v>=5?'style="color:var(--acc)"':'';return `<td class="${hi?'hi':''} ${pm}" ${fl}>${k==='plusMinus'&&+v>0?'+':''}${esc(v)}</td>`}).join('')}</tr>`;
      const tot=B.totals&&B.totals.length?`<tr class="tot"><td class="l nm">Team</td>${COLS.map(([k])=>{const i=B.keys.indexOf(k);return `<td>${esc(i>=0?B.totals[i]:'')}</td>`}).join('')}</tr>`:'';
      return `<div class="boxw${B.t.id===selId?' sel':''}"><div class="sec-h desk-only" style="margin-top:4px"><h2 style="display:flex;align-items:center;gap:8px">${logo(B.t,22)}${esc(B.t.name)}</h2></div>
        <div class="card box"><table class="tbl"><thead><tr><th class="l nm">${esc(B.t.name)}</th>${COLS.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>
        ${played.filter(p=>p.starter).map(row).join('')}${played.some(p=>!p.starter)?`<tr class="bench"><td class="l nm" colspan="${COLS.length+1}">Bench</td></tr>`:''}${played.filter(p=>!p.starter).map(row).join('')}${tot}</tbody></table></div>
        ${dnp.length?`<p class="muted" style="font-size:12px;margin:8px 4px 0">Did not play: ${dnp.map(p=>esc(p.name)+(p.reason?` (${esc(p.reason.toLowerCase())})`:'')).join(', ')}</p>`:''}</div>`};
    boxHTML=`<section class="sec"><div class="sec-h"><h2>Box score</h2>${live}</div>
      <div class="boxseg" style="margin-bottom:10px">${seg('box',[['a',g.away.t.ab],['h',g.home.t.ab]],side)}</div>
      ${order.map(tableFor).join('')}</section>`;
  }
  /* play-by-play */
  let pbpHTML='';
  if(plays.length){
    const only=sessionStorage.getItem('pbp')!=='all';
    const list=(only?plays.filter(p=>p.scoring):plays).slice(0,30);
    pbpHTML=`<section class="sec"><div class="sec-h"><h2>Play-by-play</h2><span>Newest first</span></div>
      <div style="margin-bottom:10px">${seg('pbp',[['scoring','Scoring'],['all','All plays']],only?'scoring':'all')}</div>
      <div class="card list">${list.map(p=>{const t=p.tid&&(byId[p.tid]||(p.tid===g.home.t.id?g.home.t:p.tid===g.away.t.id?g.away.t:null));
        return `<div class="pbp${p.scoring?' sc':''}"><span class="mono t">Q${p.per} ${esc(p.clock)}</span>${t?logo(t,20):'<span style="width:20px"></span>'}<span class="x">${esc(p.text)}</span><span class="mono s">${p.as??''}–${p.hs??''}</span></div>`}).join('')||'<div class="empty">No plays yet.</div>'}</div></section>`;
  }
  return `<div class="card gh">${tm(g.away,al)}${mid}${tm(g.home,hl)}</div><div class="cols"><div>${prob}${chart}${ls}${boxHTML}${ldr}</div><aside>${teamHTML}${pbpHTML}${watch}</aside></div>`;
}

/* ============ router ============ */
const VIEWS={home:[vHome,'home','Loading your team'],leaders:[vLeaders,'leaders','Loading leaders'],scores:[vScores,'scores','Loading scores'],tv:[vTV,'tv','Loading TV listings'],standings:[vStandings,'standings','Loading standings'],teams:[vTeams,'teams',''],team:[vTeam,'teams','Loading team'],game:[vGame,'scores','Loading game']};
let seq=0,current='';
async function render(silent){
  const my=++seq;const [,v,p]=(location.hash||'#/home').split('/');const [fn,tab,msg]=VIEWS[v]||VIEWS.home;
  const main=$('#main');setTab(tab);current=v||'home';
  let shown=false;const lt=silent?null:setTimeout(()=>{if(my===seq){main.innerHTML=waitHTML(msg||'Loading');shown=true}},250);
  try{
    const html=await fn(p);clearTimeout(lt);if(my!==seq)return;
    const y=window.scrollY;main.innerHTML=html;
    if(!silent){main.classList.remove('in');void main.offsetWidth;main.classList.add('in');window.scrollTo(0,0)}else window.scrollTo(0,y);
    const days=$('#days [aria-current]');if(days)days.scrollIntoView({inline:'center',block:'nearest'});
  }catch(e){clearTimeout(lt);if(my!==seq)return;
    main.innerHTML=`<div class="card err"><p>Couldn't load this: ${esc(e.message||'network error')}.</p><button class="btn pr" onclick="render()">Try again</button></div>`}
}
function setTab(tab){
  const tabs=[...document.querySelectorAll('.tab')];const i=tabs.findIndex(a=>a.dataset.tab===tab);
  tabs.forEach((a,k)=>{if(k===i)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#tabPill').style.transform=`translateX(${Math.max(0,i)*100}%)`;
}
window.addEventListener('hashchange',()=>render());

/* ============ interactions ============ */
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-follow]');
  if(f){e.preventDefault();e.stopPropagation();const id=f.dataset.follow;
    if(isFav(id)){if(S.follows.length>1)S.follows=S.follows.filter(x=>x!==id)}else S.follows.push(id);
    saveFollows();const on=isFav(id);f.setAttribute('aria-pressed',on);
    if(f.dataset.big){f.textContent=on?'Following':'Follow';f.classList.toggle('ghost',!on)}
    else{f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop')}
    applyTheme();const c=document.querySelector('.sec-h span');if(current==='teams'&&c)c.textContent=`${S.follows.length} followed`;
    return;
  }
  const sb=e.target.closest('.seg button');
  if(sb){const s=sb.parentNode,btns=[...s.querySelectorAll('button')],i=btns.indexOf(sb),v=sb.dataset.v,name=s.dataset.seg;
    btns.forEach(b=>b.setAttribute('aria-pressed',b===sb));s.querySelector('.seg-pill').style.transform=`translateX(${i*100}%)`;
    if(name==='conf')setTimeout(()=>{location.hash='#/standings/'+v},160);
    else if(name==='teamTab'){sessionStorage.setItem('teamTab',v);setTimeout(()=>render(true),160)}
    else if(name==='theme'){S.theme=v;store.set('theme',v);applyTheme()}
    else if(name==='box'){sessionStorage.setItem('boxSide',v);setTimeout(()=>render(true),160)}
    else if(name==='pbp'){sessionStorage.setItem('pbp',v);setTimeout(()=>render(true),160)}
    return;
  }
  const so=e.target.closest('[data-psort]');
  if(so){sessionStorage.setItem('pSort',so.dataset.psort);render(true);return}
  const ld=e.target.closest('[data-ldr]');
  if(ld){sessionStorage.setItem('ldr',ld.dataset.ldr);render(true);return}
  const pr=e.target.closest('[data-primary]');
  if(pr){const id=pr.dataset.primary;S.follows=[id,...S.follows.filter(x=>x!==id)];saveFollows();applyTheme();drawSheet();if(current==='home')render(true);return}
  const rm=e.target.closest('[data-unfollow]');
  if(rm){const id=rm.dataset.unfollow;if(S.follows.length>1){S.follows=S.follows.filter(x=>x!==id);saveFollows();applyTheme();drawSheet()}return}
});
function drawSheet(){
  const tmode=S.theme==='team'?'team':'dark';
  $('#sheet').innerHTML=`<div class="grab"></div><h2>Settings</h2>
    <div class="set"><p class="h">Theme</p>${seg('theme',[['dark','Dark'],['team','Team colors']],tmode)}</div>
    <div class="set"><p class="h">Your teams · the first one leads Home</p><div class="card list fl">${S.follows.map((id,i)=>{const t=byId[id];if(!t)return '';return `<div>${logo(t,28)}<span class="nm">${esc(t.name)}</span>${i===0?'<button class="on" disabled>Lead team</button>':`<button data-primary="${id}">Make lead</button>`}${S.follows.length>1?`<button data-unfollow="${id}" aria-label="Unfollow ${esc(t.name)}">Remove</button>`:''}</div>`}).join('')}</div>
      <a class="btn ghost pr" href="#/teams" style="margin-top:10px;width:100%" onclick="closeSheet()">Add teams</a></div>
    <div class="set"><p class="h">Data</p><div class="muted" style="font-size:13px">${MODE==='live'?'Live from ESPN. Scores refresh every 30 seconds while games are on.':MODE==='demo'?'ESPN isn’t reachable from here, so you’re seeing generated demo games. Once this file is hosted (Netlify), it switches to live data automatically.':'Connecting to ESPN.'}</div></div>`;
}
function openSheet(){drawSheet();document.body.classList.add('sheet-open')}
function closeSheet(){document.body.classList.remove('sheet-open')}
$('#openSet').onclick=openSheet;$('#scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* theme: dark (amber) or lead team's colors */
function applyTheme(){
  const r=document.documentElement.style,t=byId[S.follows[0]];
  if(S.theme==='team'&&t){const acc=bright(t);
    r.setProperty('--acc',acc);r.setProperty('--acc-ink',lum(acc.slice(1))>.35?'#0E0E10':'#ffffff');
    r.setProperty('--bg',`color-mix(in srgb,#${t.c1} 20%,#0B0B0D)`);r.setProperty('--s1',`color-mix(in srgb,#${t.c1} 14%,#16161A)`);
    r.setProperty('--s2',`color-mix(in srgb,#${t.c1} 18%,#202025)`);r.setProperty('--line',`color-mix(in srgb,#${t.c1} 26%,#2A2A2E)`);
  }else['--acc','--acc-ink','--bg','--s1','--s2','--line'].forEach(k=>r.removeProperty(k));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.body).backgroundColor;
}

/* live refresh */
/* live refresh: game page every 15s, other pages every 30s, only while something is live */
let tick=0;
setInterval(()=>{tick++;if(document.hidden||document.body.classList.contains('sheet-open'))return;
  const due=current==='game'||tick%2===0;
  if(due&&['home','scores','game','tv','team'].includes(current)&&document.querySelector('.live')){memo.clear();render(true)}},15000);

applyTheme();
if(!location.hash)location.replace('#/home');
render();
</script>
